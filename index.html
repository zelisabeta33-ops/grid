<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICNDY</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="container-fluid">
        <div class="container">
            <div class="head-bar">
                <a href="#" class="logo"><span>icndy</span></a>
                <div class="head-link">
                    <a href="#"><span>mens</span></a>
                    <a href="#"><span>womens</span></a>
                    <a href="#"><span>brands</span></a>
                    <a href="#"><span>sale</span></a>
                    <a href="#"><span>news</span></a>
                </div>
            </div>

            <div class="head-name">
                <h1>stüssy2014</h1>
                <h2><a href="#">shop now</a></h2>
                <a class="head-arrow" href="#more"><img src="./img/Arrow.png" alt="arrow"></a>
            </div>
        </div>
    </header>

    <main class="container main" id="more">
        <div class="main-content">
            <div class="main-item gourmet">
                <img src="./img/Layer 22.png" alt="snickers">
                <div class="main-text">
                    <img src="./img/Layer 33.png" alt="logo">
                    <h2><a class="gourmet-title" href="#g">shop gourmet</a></h2>
                </div>
            </div>
            <div class="main-item carhartt">
                <img src="./img/Layer 21.png" alt="boy">
                <div class="main-text">
                    <img src="./img/Layer 23.png" alt="logo">
                    <h2><a href="#c">shop<br>carhartt</a></h2>
                </div>
            </div>
            <div class="main-item adidas">
                <img src="./img/Layer 25.png" alt="girl">
                <div class="main-text">
                    <img src="./img/Layer 24.png" alt="logo">
                    <h2><a href="#a">shop<br>adidas</a></h2>
                </div>
            </div>
            <div class="main-item deep">
                <img src="./img/Layer 31.png" alt="boy">
                <div class="main-text">
                    <img src="./img/Layer 30.png" alt="logo">
                    <h2><a href="#d">10deep<br>sale</a></h2>
                </div>
            </div>
            <div class="main-item palace">
                <img src="./img/Layer 29.png" alt="hoodie">
                <div class="main-text">
                    <img src="./img/Layer 28.png" alt="logo">
                    <h2><a href="#p">palace<br>a/w 2014</a></h2>
                </div>
            </div>
            <div class="main-item tech">
                <img src="./img/Layer 27.png" alt="boy">
                <div class="main-text">
                    <img src="./img/Layer 26.png" alt="logo">
                    <h2><a href="#t">tech pack</a></h2>
                </div>
            </div>
        </div>
    </main>

    <section class="container-fluid instagram">
        <div class="instagram-overlay">
            <h2>#icndy on instagram</h2>
            <a href="#inst">view hashtag</a>
        </div>
        <div class="instagram-grid">
            <div class="insta-track-wrapper">
                <div class="insta-track left">
                    <div class="instagram-item"><img src="./img/Layer 8.png" alt="clothes"></div>
                    <div class="instagram-item"><img src="./img/Layer 9.png" alt="snickers"></div>
                    <div class="instagram-item"><img src="./img/Layer 10.png" alt="trainrail"></div>
                    <div class="instagram-item"><img src="./img/Layer 11.png" alt="clothes"></div>
                    
                    <div class="instagram-item"><img src="./img/Layer 8.png" alt="clothes"></div>
                    <div class="instagram-item"><img src="./img/Layer 9.png" alt="snickers"></div>
                    <div class="instagram-item"><img src="./img/Layer 10.png" alt="trainrail"></div>
                    <div class="instagram-item"><img src="./img/Layer 11.png" alt="clothes"></div>

                    <div class="instagram-item"><img src="./img/Layer 8.png" alt="clothes"></div>
                    <div class="instagram-item"><img src="./img/Layer 9.png" alt="snickers"></div>
                    <div class="instagram-item"><img src="./img/Layer 10.png" alt="trainrail"></div>
                    <div class="instagram-item"><img src="./img/Layer 11.png" alt="clothes"></div>

                    <div class="instagram-item"><img src="./img/Layer 8.png" alt="clothes"></div>
                    <div class="instagram-item"><img src="./img/Layer 9.png" alt="snickers"></div>
                    <div class="instagram-item"><img src="./img/Layer 10.png" alt="trainrail"></div>
                    <div class="instagram-item"><img src="./img/Layer 11.png" alt="clothes"></div>
                </div>
            </div>
        
            <div class="insta-track-wrapper">
                <div class="insta-track right">
                    <div class="instagram-item"><img src="./img/Layer 12.png" alt="view from building"></div>
                    <div class="instagram-item"><img src="./img/Layer 13.jpg" alt="snickers"></div>
                    <div class="instagram-item"><img src="./img/Layer 14.jpg" alt="clothes"></div>
                    <div class="instagram-item"><img src="./img/Layer 15.jpg" alt="boy"></div>

                    <div class="instagram-item"><img src="./img/Layer 12.png" alt="view from building"></div>
                    <div class="instagram-item"><img src="./img/Layer 13.jpg" alt="snickers"></div>
                    <div class="instagram-item"><img src="./img/Layer 14.jpg" alt="clothes"></div>
                    <div class="instagram-item"><img src="./img/Layer 15.jpg" alt="boy"></div>

                    <div class="instagram-item"><img src="./img/Layer 12.png" alt="view from building"></div>
                    <div class="instagram-item"><img src="./img/Layer 13.jpg" alt="snickers"></div>
                    <div class="instagram-item"><img src="./img/Layer 14.jpg" alt="clothes"></div>
                    <div class="instagram-item"><img src="./img/Layer 15.jpg" alt="boy"></div>

                    <div class="instagram-item"><img src="./img/Layer 12.png" alt="view from building"></div>
                    <div class="instagram-item"><img src="./img/Layer 13.jpg" alt="snickers"></div>
                    <div class="instagram-item"><img src="./img/Layer 14.jpg" alt="clothes"></div>
                    <div class="instagram-item"><img src="./img/Layer 15.jpg" alt="boy"></div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-container">
            <nav class="foot-nav">
                <p>©icndy2014</p>
                <a href="#pr">privacy</a>
                <a href="#tr">terms</a>
                <a href="#shp">shop</a>
                <a href="#ab">about</a>
                <a href="#cn">contact</a>
            </nav>
            <div class="foot-socials">
                <a href="#instgr"><img src="./img/IG.png" alt="instagram"></a>
                <a href="#fb"><img src="./img/FB.png" alt="facebook"></a>
                <a href="#tw"><img src="./img/TWTR.png" alt="twitter"></a>
            </div>
        </div>
    </footer>
</body>
</html>
